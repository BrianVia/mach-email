[workspace]
resolver = "2"
members = [
    "crates/mach-core",
    "crates/mach-store",
    "crates/mach-gmail",
    "crates/mach-tui",
    "crates/mach-mcp",
    "crates/mach-cli",
    "crates/mach-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
authors = ["Brian Via <brian.a.via@gmail.com>"]
license = "MIT"
repository = "https://github.com/brianvia/mach-email"

[workspace.dependencies]
# Internal crates
mach-core = { path = "crates/mach-core" }
mach-store = { path = "crates/mach-store" }
mach-gmail = { path = "crates/mach-gmail" }
mach-tui = { path = "crates/mach-tui" }
mach-mcp = { path = "crates/mach-mcp" }

# Serialization & schema
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "0.8", features = ["chrono"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Errors & logging
thiserror = "1"
color-eyre = "0.6"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "fs", "io-util", "io-std", "net"] }
async-trait = "0.1"
futures = "0.3"

# Identifiers
uuid = { version = "1", features = ["v4", "serde"] }

# Filesystem & config
directories = "5"
figment = { version = "0.10", features = ["toml", "env"] }
toml = "0.8"

# Storage
rusqlite = { version = "0.31", features = ["bundled", "serde_json", "chrono"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
refinery = { version = "0.8", features = ["rusqlite"] }

# HTTP / OAuth / keyring
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "stream"] }
oauth2 = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
keyring = "3"
url = "2"
webbrowser = "1"
dotenvy = "0.15"
base64 = "0.22"

# TUI
ratatui = "0.28"
crossterm = { version = "0.28", features = ["event-stream"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# MIME
mail-parser = "0.9"
mail-builder = "0.4"

# Misc
notify = "6"
html2text = "0.12"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
