name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: Mach.app and CLI (Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # build-app.sh stamps CFBundleVersion with the commit count.
          fetch-depth: 0

      - name: Select the newest Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | grep -E '/Xcode_[0-9.]+\.app$' | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          swift --version

      - name: Install Rust
        run: rustup target add aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Test the workspace
        run: cargo test --workspace

      - name: Build Mach.app
        run: bash macos/scripts/build-app.sh

      - name: Test the Swift package
        working-directory: macos
        run: swift test

      - name: Build the CLI
        run: cargo build --release -p mach-cli --target aarch64-apple-darwin

      - name: Package
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml)"
          mkdir dist
          ditto -c -k --keepParent macos/build/Mach.app "dist/Mach-$version-macos-arm64.zip"
          tar -czf "dist/mach-$version-aarch64-apple-darwin.tar.gz" -C target/aarch64-apple-darwin/release mach

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  linux-cli:
    name: CLI (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: Swatinem/rust-cache@v2

      - name: Build the CLI
        run: cargo build --release -p mach-cli --target x86_64-unknown-linux-gnu

      - name: Package
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml)"
          mkdir dist
          tar -czf "dist/mach-$version-x86_64-unknown-linux-gnu.tar.gz" -C target/x86_64-unknown-linux-gnu/release mach

      - uses: actions/upload-artifact@v4
        with:
          name: linux-cli
          path: dist/*

  # One job uploads everything: parallel uploads to a draft can each create their own draft.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux-cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
