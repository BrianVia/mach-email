name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS (Apple Silicon)
          - os: ubuntu-latest
            name: Linux (x86_64)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        working-directory: crates/mach-desktop/ui
        run: bun install --frozen-lockfile

      - name: Build app bundles
        working-directory: crates/mach-desktop
        run: bunx @tauri-apps/cli@^2 build

      - name: Upload installers to the release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app.tar.gz
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/rpm/*.rpm
