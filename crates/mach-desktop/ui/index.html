<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mach</title>
    <style>
      /* Pre-mount only: theme.css takes over once the app renders. The
         color-scheme declaration keeps the flash matched to the OS theme. */
      :root { color-scheme: light dark; }
      html, body, #app { height: 100%; margin: 0; }
      #mach-boot-probe {
        position: fixed; inset: 0; display: flex;
        align-items: center; justify-content: center;
        font: 13px system-ui, sans-serif; opacity: 0.5;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- visible until JS mounts; replaced/cleared on render() -->
      <div id="mach-boot-probe">mach is booting…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
